# TEMPLATE. Copy this file to .github/workflows/sync.yml to turn it on (see README, CRON_SECRET).
# expires old vacancies, audits "open" verdicts and sends Pro alerts. Needs two repository secrets:
#   APP_URL      your site, e.g. https://cleone.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET variable in Vercel
name: Job sync
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run the scheduled sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Add the APP_URL and CRON_SECRET repository secrets first."; exit 1; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/jobs"
