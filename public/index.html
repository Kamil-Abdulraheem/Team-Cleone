<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleone</title>
<style>
:root{--bg:#fcfcfc;--surface:#fff;--ink:#111;--mute:#8a8a8e;--line:#e8e8ea;--accent:#2f6bd6;--soft:#e8f0fc;--shadow:0 2px 14px rgba(0,0,0,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#161617;--surface:#202022;--ink:#f2f2f3;--mute:#8d8d93;--line:#2e2e31;--accent:#6b9cf0;--soft:#1f2a40;--shadow:0 2px 14px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Roboto,"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.up{color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center}
.ic{color:var(--mute)}
main{flex:1;overflow-y:auto;padding:0 20px}
.home{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:12px}
.home h1{font-size:2.1rem;font-weight:400;text-align:center;margin-top:22vh}
.row{display:flex;gap:18px;align-items:center;padding:14px 8px;color:var(--mute);font-size:1.15rem;text-align:left;border-radius:12px;width:100%}
.row:hover,.row:focus-visible{background:var(--soft);color:var(--ink);outline:none}
.bar{background:var(--surface);border-radius:32px;box-shadow:var(--shadow);padding:16px 18px 12px;margin:14px 0 6px}
.bar input{width:100%;border:0;outline:0;background:none;font:inherit;font-size:1.1rem;color:var(--ink)}
.bar .b{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.go{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.go svg{stroke:#fff}
h2{font-size:1.5rem;font-weight:500;margin:6px 0 4px}
.sub{color:var(--mute);margin-bottom:16px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:13px;font:inherit}
.btn{background:var(--accent);color:#fff;padding:12px 20px;border-radius:24px;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--soft);padding:4px;border-radius:24px}
.tabs button{flex:1;padding:8px 4px;border-radius:20px;color:var(--mute);font-size:.95rem}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;gap:12px}
.name{font-weight:600;font-size:1.1rem}
.kind{color:var(--mute);font-size:.9rem}
.score{font-size:1.6rem;font-weight:600;color:var(--accent);line-height:1}
.dims{display:flex;gap:14px;color:var(--mute);font-size:.88rem;margin:10px 0;flex-wrap:wrap}
.dims b{color:var(--ink)}
.sig{color:var(--accent);font-size:.95rem}
.why{margin:10px 0 14px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{padding:9px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);display:flex;gap:6px;align-items:center;font-size:.95rem}
.acts button svg{width:18px;height:18px}
.acts .p{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts .p svg{stroke:#fff}
.lock{position:relative;overflow:hidden}
.lock .blur{filter:blur(6px);user-select:none;pointer-events:none}
.lock .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--surface);width:100%;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.mail{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px;margin:12px 0;font-size:.97rem}
.side{position:absolute;inset:0 30% 0 0;background:var(--surface);z-index:30;padding:24px 14px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
.side.on{transform:none}
.side .row{color:var(--ink);font-size:1.05rem}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:.92rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.back{color:var(--accent);margin-bottom:8px;display:flex;gap:4px;align-items:center}
.note{background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
.steps p{color:var(--mute);padding:6px 0}.steps p.done{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Everything above this line is the prototype, unchanged. Below: styles added for accounts, settings and billing. ===== */
:root[data-theme="light"]{--bg:#fcfcfc;--surface:#fff;--ink:#111;--mute:#8a8a8e;--line:#e8e8ea;--accent:#2f6bd6;--soft:#e8f0fc;--shadow:0 2px 14px rgba(0,0,0,.07);color-scheme:light}
:root[data-theme="dark"]{--bg:#161617;--surface:#202022;--ink:#f2f2f3;--mute:#8d8d93;--line:#2e2e31;--accent:#6b9cf0;--soft:#1f2a40;--shadow:0 2px 14px rgba(0,0,0,.4);color-scheme:dark}
.side{display:flex;flex-direction:column;overflow-y:auto}
.side .hd{font-size:1.3rem;font-weight:600;padding:0 8px 14px}
.side .rec{color:var(--mute);font-size:.82rem;padding:14px 8px 4px}
.side .row.sm{font-size:.95rem;padding:9px 8px;gap:12px;color:var(--mute)}
.me{margin-top:auto;display:flex;gap:12px;align-items:center;padding:12px 8px;border-radius:14px;width:100%;text-align:left}
.me:hover,.me:focus-visible{background:var(--soft);outline:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.me b{display:block;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.me small{display:block;color:var(--mute);font-size:.8rem}
.field{margin-bottom:12px}
.field label{display:block;color:var(--mute);font-size:.88rem;margin:0 0 4px 6px}
.err{color:#c0392b;font-size:.92rem;min-height:1.4em;margin:6px 0}
.lnk{color:var(--accent);padding:6px 2px}
.center{text-align:center}
.sec{color:var(--mute);font-size:.85rem;margin:22px 0 8px 6px;text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--accent)}
.sw{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.w{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.danger{color:#c0392b}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn[disabled]{opacity:.6;cursor:default}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:20px}
.seg button{flex:1;padding:7px 4px;border-radius:16px;color:var(--mute);font-size:.92rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tap{cursor:pointer}.tap:hover{box-shadow:0 4px 18px rgba(0,0,0,.12)}
.bd{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:12px;background:var(--soft);color:var(--mute);margin:0 6px 4px 0}
.bd.good{background:#e3f4e8;color:#1e7a3c}.bd.warn{background:#fdf1d8;color:#8a5a00}.bd.bad{background:#fbe3e0;color:#c0392b}
@media(prefers-color-scheme:dark){.bd.good{background:#16301f;color:#6fcf8a}.bd.warn{background:#3a2e12;color:#e8b84f}.bd.bad{background:#3a1c19;color:#f08a80}}
textarea.in{resize:vertical;font:inherit}a.btn{text-decoration:none;display:inline-block}a.lnk{text-decoration:none}

/* ===== Home redesign: white page, soft grey cards, black primary actions, bottom tabs ===== */
:root,:root[data-theme="light"]{--bg:#fff;--surface:#f4f4f6;--ink:#111;--mute:#7c7c82;--line:#e6e6ea;--soft:#ececf0;--shadow:0 1px 2px rgba(0,0,0,.05);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--surface:#1d1d20;--ink:#f2f2f3;--mute:#919198;--line:#2c2c30;--soft:#2a2a2e;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--surface:#1d1d20;--ink:#f2f2f3;--mute:#919198;--line:#2c2c30;--soft:#2a2a2e;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
header{padding:12px 18px}
.ic{width:40px;height:40px;display:grid;place-items:center;position:relative;color:var(--ink)}
.pill{display:flex;gap:7px;align-items:center;background:var(--surface);border-radius:22px;padding:8px 16px;font-weight:500;font-size:.95rem}
.pill svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#e5484d;border:2px solid var(--bg);display:none}.dot.on{display:block}
.pvbar{display:none;background:#fdf1d8;color:#6b4700;font-size:.82rem;text-align:center;padding:6px 14px}.pvbar.on{display:block}
@media(prefers-color-scheme:dark){.pvbar{background:#3a2e12;color:#e8c36a}}
#tabs{display:none;border-top:1px solid var(--line);background:var(--bg);padding:6px 6px 4px}#tabs.on{display:flex}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mute);font-size:.74rem;padding:4px 0;border-radius:12px}
#tabs button.on{color:var(--ink);font-weight:600}
#tabs svg{width:24px;height:24px}
.panel,.side{background:var(--bg)}
.card{box-shadow:none}.acts button{background:var(--bg)}
.tabs button.on,.seg button.on{background:var(--bg)}
.hm{padding-bottom:18px}
.greet{font-size:1.5rem;font-weight:600;line-height:1.25;margin:22px 0 18px}
.ask{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:30px;padding:7px 7px 7px 8px}
.ask input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:1.02rem;color:var(--ink);padding:10px 4px}
.ask .plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ask .mic{color:var(--mute)}
.ask .go{width:42px;height:42px;background:var(--ink)}.ask .go svg{stroke:var(--bg)}
.hint{color:var(--mute);font-size:.88rem;margin:10px 8px 0}
.reply{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:.95rem}
.reply.err{color:#c0392b}
.reply .acts{margin-top:10px}
.sech{display:flex;justify-content:space-between;align-items:center;margin:26px 0 8px;font-weight:600;font-size:1.05rem}
.sech .ic{width:32px;height:32px}.sech svg{width:20px;height:20px}
.act{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:11px 14px;margin-bottom:10px;width:100%;text-align:left}
.act .ai{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink)}
.act .tx{min-width:0;flex:1}.act b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act small{color:var(--mute);font-size:.82rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{color:var(--mute);font-size:.85rem;margin:18px 6px 8px}
.empty{background:var(--surface);border-radius:16px;padding:16px;color:var(--mute);font-size:.95rem}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;padding:16px;margin:8px 0 14px}
.prof .av{width:52px;height:52px;font-size:1.3rem}
.lst .row{background:var(--surface);color:var(--ink);margin-bottom:8px;border-radius:16px;padding:14px 16px;font-size:1.02rem}
</style>
</head>
<body>
<div id="app">
<header>
<button class="ic" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
<button class="pill" id="upg"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6"/></svg><span id="upt">Upgrade</span></button>
<button class="ic" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><i class="dot" id="dot"></i></button>
</header>
<div class="pvbar" id="pv" role="status"></div>
<main id="main"></main>
<nav id="tabs" aria-label="Main">
<button data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
<button data-t="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explore</span></button>
<button data-t="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>History</span></button>
<button data-t="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Account</span></button>
</nav>
<div class="side" id="side"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
